map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream server_backend {
    server server:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Backend-only: no website_frontend upstream.
# Frontend: https://starwaves.susindran.in (Vercel)
# Backend:  https://api.starwaves.susindran.in (this VM)
# This VM serves only /api, /ws, /health, /docs. "/" redirects to frontend.

server {
    listen 80;
    listen [::]:80;
    server_name api.starwaves.susindran.in _;

    # Let's Encrypt ACME challenge — must be reachable via HTTP before TLS
    # docker-compose mounts ./certbot/www:/var/www/certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Nginx & Backend Health check route
    location /health {
        proxy_pass http://server_backend/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Proxy — burst 60 to handle dashboard + preflight OPTIONS double-count
    location /ws/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://server_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Docs
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://server_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Eve streams — burst 30 (SSE tool loops may retry)
    location /api/v1/eve/chat/stream {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://server_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    location /api/v1/eve/synthesize/stream {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://server_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Updates static + API (backend-hosted APK/EXE/ZIP)
    location /updates/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://server_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API — dashboard burst: EvePage fires ~15 concurrent requests on load (+ OPTIONS preflight doubles to ~30)
    # Burst 60 gives headroom for health probes + concurrent tabs; 10r/s still protects e2-micro.
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_conn addr 60;
        proxy_pass http://server_backend;
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Root — redirect to Vercel frontend (backend-only mode)
    location = / {
        return 302 https://starwaves.susindran.in/;
    }
    location / {
        # API-only VM: any non-API route goes to Vercel
        return 302 https://starwaves.susindran.in$request_uri;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

