map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream server_backend {
    server server:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream website_frontend {
    server website:80 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Redirect HTTP to HTTPS (Uncomment when SSL certificate is configured)
    # return 301 https://$host$request_uri;

    # Nginx & Backend Health check route
    location /health {
        proxy_pass http://server_backend/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Proxy (persistent connections need a long read timeout)
    location /ws/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://server_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep WebSocket connections alive; must exceed the server-side ping interval (25s)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # FastAPI Documentation & OpenAPI Schema Proxy
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://server_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Eve Chat SSE Stream (buffering must be off; long read timeout for tool loops)
    location /api/v1/eve/chat/stream {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://server_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # SSE: disable buffering so deltas flush immediately; allow long streams
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    # Eve TTS Audio Stream (chunked MP3 from Fish S2.1 Pro Free via OpenRouter)
    location /api/v1/eve/synthesize/stream {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://server_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API Proxy Routing (rate-limited for e2-micro single worker)
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_conn addr 20;
        proxy_pass http://server_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts for API endpoints
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend Website SPA Proxy Routing
    location / {
        proxy_pass http://website_frontend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket / HMR support if needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

