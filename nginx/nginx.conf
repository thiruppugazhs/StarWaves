user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access_log.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Client body size limit (20MB for document/attachment uploads)
    client_max_body_size 20M;

    # Rate limiting — relaxed for dashboard burst (e2-micro still protected by single worker + 512M)
    # EvePage + settings fire ~15 concurrent /api/* on load; burst 10 tripped 503s (see 2026-08-30 api starwaves 10.375 excess).
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_req_status 429;
    limit_conn_status 429;
    # CORS for rate-limited 429s: limit_req 429 is generated by nginx before proxy_pass,
    # so FastAPI CORSMiddleware never runs. Use a map to mirror allowed origins with
    # proper validation (kept in sync with server/app/core/cors.py ALLOWED_ORIGIN_REGEX).
    map $http_origin $cors_allow_origin {
        default "";
        ~^https://([a-zA-Z0-9-]+\.)*susindran\.in$ $http_origin;
        ~^https://([a-zA-Z0-9-]+\.)*vercel\.app$ $http_origin;
        ~^https?://(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$ $http_origin;
        ~^capacitor://localhost$ $http_origin;
        ~^tauri://localhost$ $http_origin;
        ~^https://tauri\.localhost$ $http_origin;
        ~^com\.starwaves\.app://.*$ $http_origin;
        ~^app\.starwaves\.workspace://.*$ $http_origin;
    }
    # Conditional CORS flags — only emit when origin is allowed (prevents leaking credentials to evil origins)
    map $cors_allow_origin $cors_allow_credentials {
        default "";
        ~. "true";
    }
    map $cors_allow_origin $cors_allow_methods {
        default "";
        ~. "GET, POST, PUT, PATCH, DELETE, OPTIONS";
    }
    map $cors_allow_origin $cors_allow_headers {
        default "";
        ~. "Authorization, Content-Type, Accept, X-Requested-With, X-Device-Id, X-Device-Name";
    }
    map $cors_allow_origin $cors_expose_headers {
        default "";
        ~. "Content-Length, Retry-After";
    }
    map $cors_allow_origin $cors_vary {
        default "";
        ~. "Origin";
    }
    # Structured JSON not added to keep 1GB lean; use main log + warn error_log

    # Gzip Compression Configuration
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Security Headers Defaults. Signed Studio previews need a narrowly scoped
    # cross-origin frame policy because the frontend and API use separate hosts.
    map $uri $studio_frame_options {
        default "SAMEORIGIN";
        ~^/api/v1/studio/preview/ "";
    }
    map $uri $studio_content_security_policy {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'";
        ~^/api/v1/studio/preview/ "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; frame-ancestors 'self' http://localhost:* http://127.0.0.1:* https://starwaves.susindran.in; object-src 'none'; base-uri 'self'";
    }
    add_header X-Frame-Options $studio_frame_options always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy $studio_content_security_policy always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self)" always;

    # CORS on every response including 429s from limit_req / limit_conn
    # Must use `always` so error responses also carry CORS; empty $cors_allow_origin results in no header.
    # Conditional maps prevent leaking Allow-Credentials to disallowed origins (e.g. evil.com).
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Credentials $cors_allow_credentials always;
    add_header Access-Control-Allow-Methods $cors_allow_methods always;
    add_header Access-Control-Allow-Headers $cors_allow_headers always;
    add_header Access-Control-Expose-Headers $cors_expose_headers always;
    add_header Vary $cors_vary always;

    # Include server configuration blocks
    include /etc/nginx/conf.d/*.conf;
}
