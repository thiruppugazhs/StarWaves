# Backend-only stack — no website build.
# Frontend is expected on Vercel (starwaves.susindran.in).
# Use with GHCR overlay for zero local build:
#   docker compose -f docker-compose.yml -f docker-compose.backend.yml -f docker-compose.ghcr.backend.yml up -d
#
# Or local build:
#   docker compose -f docker-compose.yml -f docker-compose.backend.yml up --build -d

services:
  # disable website so nginx serves API only (and optionally static 404 for /)
  website:
    profiles: ["with-website"]  # hidden unless --profile with-website
    # alternatively, `docker compose --profile with-website up` to bring it back

  nginx:
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.backend.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx

  # server, postgres, redis, whatsapp-worker stay as in docker-compose.yml
