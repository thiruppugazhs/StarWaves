name: Deploy Backend to GCP VM

# Auto-deploy backend GHCR image to VM after push to main.
# Requires repo secrets: GCP_HOST, GCP_USER, GCP_SSH_KEY
# VM must have docker + git clone at ~/starwaves

on:
  workflow_run:
    workflows: ["Backend — Build and Push to GHCR", "Build and Push to GHCR"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd ~/starwaves
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            git pull origin main
            docker compose -f docker-compose.yml -f docker-compose.backend.yml -f docker-compose.ghcr.backend.yml pull
            docker compose -f docker-compose.yml -f docker-compose.backend.yml -f docker-compose.ghcr.backend.yml up -d
            docker compose ps
            curl -fsS http://localhost:8000/api/v1/health && echo "health ok"
            docker image prune -f

      - name: Summary
        run: echo "Deployed backend to GCP VM via SSH"
