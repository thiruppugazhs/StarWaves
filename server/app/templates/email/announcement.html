<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - StarWaves</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #09090b;
      padding: 40px 16px;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      background-color: #121212;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 36px 32px;
    }
    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 16px 0;
    }
    .content-box {
      font-size: 14px;
      line-height: 1.6;
      color: #a1a1aa;
      margin-bottom: 24px;
    }
    .btn-container {
      margin: 28px 0;
    }
    .btn {
      display: inline-block;
      background-color: #ffffff;
      color: #09090b;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 6px;
      text-align: center;
    }
    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #27272a;
      font-size: 12px;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="brand">StarWaves</div>
      <h1>{{ title }}</h1>
      <p style="font-size:14px; color:#a1a1aa; margin-bottom:16px;">Hello {{ user_name }},</p>
      <div class="content-box">
        {{ message }}
      </div>
      <div class="btn-container">
        <a href="{{ app_url }}" class="btn">Open StarWaves</a>
      </div>
      <div class="footer">
        StarWaves Announcements • Automated System Message
      </div>
    </div>
  </div>
</body>
</html>
